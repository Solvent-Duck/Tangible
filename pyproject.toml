[project]
name = "tangible"
version = "0.1.0"
description = "Operational due diligence for lenders: agent investigates, tools compute, policy decides."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tangible"]

[project.scripts]
tangible-migrate = "tangible.db.migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (make db-up)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
