[project]
name = "tangible"
version = "0.1.0"
description = "Operational due diligence for lenders: agent investigates, tools compute, policy decides."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "openpyxl>=3.1.5",
    "pypdf>=5.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
    "strands-agents==1.57.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-openpyxl>=3.1.5.20260827",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tangible"]

[project.scripts]
tangible-migrate = "tangible.db.migrate:main"
tangible-ingest = "tangible.ingest.cli:main"
tangible-replay = "tangible.assessment.cli:main"
tangible-backtest = "tangible.backtest.cli:main"
tangible-workbench = "tangible.workbench.app:main"
tangible-pull = "tangible.connectors.cli:main"
tangible-sandbox = "tangible.connectors.sandbox:main"
tangible-demo = "tangible.demo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (make db-up)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
