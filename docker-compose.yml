services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tangible
      POSTGRES_PASSWORD: tangible
      POSTGRES_DB: tangible
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangible"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
